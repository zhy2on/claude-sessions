<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">
  <!-- terminal window -->
  <rect x="0" y="0" width="760" height="360" rx="10" fill="#1e1e1e"/>

  <!-- title bar -->
  <rect x="0" y="0" width="760" height="30" rx="10" fill="#2d2d2d"/>
  <rect x="0" y="20" width="760" height="10" fill="#2d2d2d"/>
  <circle cx="20" cy="15" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="15" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="15" r="6" fill="#27c93f"/>
  <text x="380" y="19" fill="#9a9a9a" font-size="12" text-anchor="middle">claude-sessions</text>

  <!-- header line -->
  <text x="20" y="54" fill="#eaeaea" font-size="14" font-weight="bold">Claude sessions: ~/code/my-project  (5)</text>

  <!-- session rows (dimmed behind the dialog) -->
  <g font-size="13.5" fill="#6a6a6a">
    <rect x="12" y="72" width="736" height="22" fill="#2f3135"/>
    <text x="20" y="88">  2026-10-08 09:28     12K  Set up the staging deploy pipeline</text>
    <text x="20" y="112">  2026-10-07 21:03    441K  Debug flaky integration test in checkout flow</text>
    <text x="20" y="136">* 2026-10-07 14:41    318K  Refactor pagination logic for the dashboard</text>
    <text x="20" y="160">  2026-10-04 16:48      6K  Investigate memory leak in the worker process</text>
    <text x="20" y="184">  2026-09-30 09:31      1M  (no title)</text>
  </g>

  <!-- delete confirmation dialog -->
  <rect x="170" y="140" width="420" height="100" rx="4" fill="#252526" stroke="#6e6e6e" stroke-width="1.5"/>
  <text x="186" y="168" fill="#e06c75" font-size="14" font-weight="bold">Delete this session?</text>
  <text x="186" y="190" fill="#d4d4d4" font-size="13">Set up the staging deploy pipeline</text>

  <!-- [ Yes ]  [ No ] (No selected by default) -->
  <text x="300" y="222" fill="#d4d4d4" font-size="13.5">[ Yes ]</text>
  <rect x="375" y="208" width="58" height="19" fill="#d4d4d4"/>
  <text x="383" y="222" fill="#1e1e1e" font-size="13.5">[ No ]</text>

  <!-- status / help line -->
  <text x="20" y="348" fill="#c9a227" font-size="12.5">up/down move  d delete  c copy  m move  q/Esc quit   * = running</text>
</svg>
