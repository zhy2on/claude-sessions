<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">
  <!-- terminal window -->
  <rect x="0" y="0" width="760" height="360" rx="10" fill="#1e1e1e"/>

  <!-- title bar -->
  <rect x="0" y="0" width="760" height="30" rx="10" fill="#2d2d2d"/>
  <rect x="0" y="20" width="760" height="10" fill="#2d2d2d"/>
  <circle cx="20" cy="15" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="15" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="15" r="6" fill="#27c93f"/>
  <text x="380" y="19" fill="#9a9a9a" font-size="12" text-anchor="middle">claude-sessions</text>

  <!-- header line -->
  <text x="20" y="54" fill="#eaeaea" font-size="14" font-weight="bold">Claude sessions: ~/code/my-project  (5)</text>

  <!-- session rows -->
  <g font-size="13.5">
    <!-- selected row -->
    <rect x="12" y="72" width="736" height="22" fill="#3a3d41"/>
    <text x="20" y="88" fill="#ffffff">  2026-10-08 09:28     12K  Set up the staging deploy pipeline</text>

    <text x="20" y="112" fill="#d4d4d4">  2026-10-07 21:03    441K  Debug flaky integration test in checkout flow</text>

    <!-- running row (dim, marked) -->
    <text x="20" y="136" fill="#d8b858">* 2026-10-07 14:41    318K  Refactor pagination logic for the dashboard</text>

    <text x="20" y="160" fill="#d4d4d4">  2026-10-04 16:48      6K  Investigate memory leak in the worker process</text>

    <text x="20" y="184" fill="#d4d4d4">  2026-09-30 09:31      1M  (no title)</text>
  </g>

  <!-- status / help line -->
  <text x="20" y="348" fill="#c9a227" font-size="12.5">up/down move  d delete  c copy  m move  q/Esc quit   * = running</text>
</svg>
